<style>
  :root{
    --bg:#0b0b0d;
    --bg-panel:#141417;
    --bg-panel-2:#1b1b1f;
    --line:rgba(255,255,255,0.09);
    --line-soft:rgba(255,255,255,0.05);
    --red:#e2222c;
    --red-dim:#8f151d;
    --red-glow:rgba(226,34,44,0.35);
    --white:#f3f3f5;
    --gray:#9a9aa3;
    --gray-dim:#5c5c66;
    --green:#3ecf8e;
    --amber:#e2a622;
    --font-display:'Rajdhani',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:var(--font-body);
    min-height:100vh;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 75%);
    pointer-events:none;
    z-index:0;
  }
  a{color:var(--red);}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; letter-spacing:0.02em; margin:0;}
  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--red);}
  #app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}

  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px clamp(20px,5vw,56px);

let route = parseHash();

function parseHash(){
  const h = location.hash.replace('#','');
  return h === 'admin' ? 'admin' : 'public';
}
window.addEventListener('hashchange', ()=>{ route = parseHash(); render(); });

function uid(){ return crypto.randomUUID(); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function showToast(msg, isErr){
  let t = document.querySelector('.toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.className='toast' + (isErr?' err':''); t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 4200);
}

/* ---------------- image compression → Blob ---------------- */
function fileToCompressedBlob(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.onload = () => {
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * (maxDim/w)); w = maxDim; }
        else { w = Math.round(w * (maxDim/h)); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
    };
    img.onerror = reject;
    img.src = e.target.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
const PHOTO_MAX_DIM = 1600;
const PHOTO_QUALITY = 0.72;   // standardized compression — every photo lands around ~300-800KB
const MAX_VEHICLE_PHOTOS = 5;

/* ---------------- auth/session bootstrap ---------------- */
async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(data && data.session){
    await loadProfileIntoCurrentUser(data.session.user.id, data.session.user.email);
  }
}
async function loadProfileIntoCurrentUser(userId, email){
  const { data, error } = await sb.from('team_profiles').select('*').eq('id', userId).maybeSingle();
  if(!error && data){
    currentUser = { id:data.id, name:data.name, email:data.email, role:data.role };

  }

/* ================= ROOT RENDER ================= */
async function render(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="spinner-line">Loading…</div>';

  if(route === 'admin'){
    if(currentUser){
      app.innerHTML = await AdminDashboard();
      bindAdminEvents();
      return;
    }
    const { data: teamExists, error } = await sb.rpc('team_exists');
    if(error){
      app.innerHTML = ConnectionError(error);
      return;
    }
    if(!teamExists){
      app.innerHTML = AdminSetup();
      bindSetupEvents();
    } else {
      app.innerHTML = AdminLogin();
      bindLoginEvents();
    }
  } else {
    app.innerHTML = await PublicForm();
    bindPublicFormEvents();
  }
}

let idPhotoBlob = null;
let idPhotoPreviewUrl = null;
let vehiclePhotoBlobs = [];
let vehiclePhotoPreviewUrls = [];

function bindPublicFormEvents(){
  const form = document.getElementById('regForm');
  if(!form) return;

  document.querySelectorAll('input[name=inClub]').forEach(r=>{
    r.addEventListener('change', ()=>{
      document.getElementById('clubNameWrap').style.display = r.value==='yes' && r.checked ? 'block' : 'none';
    });
  });

  document.querySelectorAll('.opt-row').forEach(row=>{
    const input = row.querySelector('input');
    input.addEventListener('change', ()=>{
      if(input.type === 'radio'){
        row.closest('.radio-grid, .check-grid').querySelectorAll('.opt-row').forEach(r=>r.classList.remove('checked'));
      }
      row.classList.toggle('checked', input.checked);
    });
  });

  const idInput = document.getElementById('idInput');
  idInput.addEventListener('change', async ()=>{
    if(!idInput.files[0]) return;
    document.getElementById('idUpTitle').textContent = 'Compressing…';
    const blob = await fileToCompressedBlob(idInput.files[0], 1400, 0.75);
    idPhotoBlob = blob;
    idPhotoPreviewUrl = URL.createObjectURL(blob);
    document.getElementById('idUpTitle').textContent = 'Tap to replace ID photo';
    renderThumbs('idThumbs', [idPhotoPreviewUrl]);
  });
  document.getElementById('idThumbs').addEventListener('click', (e)=>{
    if(e.target.classList.contains('rm')){
      idPhotoBlob = null; idPhotoPreviewUrl = null;
      document.getElementById('idUpTitle').textContent = 'Tap to attach ID photo';
      renderThumbs('idThumbs', []);
    }
  });

  const photoInput = document.getElementById('photoInput');
  photoInput.addEventListener('change', async ()=>{
    const files = Array.from(photoInput.files).slice(0, MAX_VEHICLE_PHOTOS - vehiclePhotoBlobs.length);
    if(files.length === 0){ showToast(`You can attach up to ${MAX_VEHICLE_PHOTOS} photos.`, true); photoInput.value=''; return; }
    document.getElementById('photoUpTitle').textContent = 'Compressing…';
    for(const f of files){
      const blob = await fileToCompressedBlob(f, PHOTO_MAX_DIM, PHOTO_QUALITY);
      vehiclePhotoBlobs.push(blob);
      vehiclePhotoPreviewUrls.push(URL.createObjectURL(blob));
    }
    document.getElementById('photoUpTitle').textContent = 'Tap to attach vehicle photos';
    renderThumbs('photoThumbs', vehiclePhotoPreviewUrls);
    photoInput.value = '';
  });
  document.getElementById('photoThumbs').addEventListener('click', (e)=>{
    if(e.target.classList.contains('rm')){
      const i = +e.target.dataset.i;
      vehiclePhotoBlobs.splice(i,1);
      vehiclePhotoPreviewUrls.splice(i,1);
      renderThumbs('photoThumbs', vehiclePhotoPreviewUrls);
    }
  });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!validateForm(form)) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Submitting…';

    try{
      const fd = new FormData(form);
      const cycles = fd.getAll('cycles');
      const subId = uid();

      let idPath = null;
      if(idPhotoBlob){
        idPath = `${subId}/id.jpg`;
        const { error: idErr } = await sb.storage.from(BUCKET).upload(idPath, idPhotoBlob, {contentType:'image/jpeg'});
        if(idErr) throw idErr;
      }
      const photoPaths = [];
      for(let i=0;i<vehiclePhotoBlobs.length;i++){
        const p = `${subId}/photo-${i+1}.jpg`;
        const { error: pErr } = await sb.storage.from(BUCKET).upload(p, vehiclePhotoBlobs[i], {contentType:'image/jpeg'});
        if(pErr) throw pErr;
        photoPaths.push(p);
      }

      const row = {
        id: subId,
        event_id: fd.get('eventId'),
        status: 'pending',
        full_name: fd.get('fullName').trim(),
        email: fd.get('email').trim(),
        phone: fd.get('phone').trim(),
        in_club: fd.get('inClub'),
        club_name: fd.get('clubName') ? fd.get('clubName').trim() : '',
        social: fd.get('social').trim(),
        experience: fd.get('experience'),
        cycles,
        vehicle: fd.get('vehicle').trim(),
        modifications: fd.get('modifications') ? fd.get('modifications').trim() : '',
        plate: fd.get('plate').trim().toUpperCase(),
        id_photo_path: idPath,
        photo_paths: photoPaths
      };
      const { error: insErr } = await sb.from('submissions').insert(row);
      if(insErr) throw insErr;

      const { data: events } = await sb.from('events').select('*').eq('id', row.event_id).maybeSingle();
      document.getElementById('app').innerHTML = ConfirmationScreen(row, events);
    } catch(err){
      console.error(err);
      showToast('Submission failed: ' + (err.message||'please try again'), true);
      btn.disabled = false; btn.textContent = 'Submit Registration';
    }
  });
}

function renderThumbs(containerId, urls){
  const c = document.getElementById(containerId);
  c.innerHTML = urls.map((src,i)=>`
    <div class="thumb"><img src="${src}"><div class="rm" data-i="${i}">×</div></div>
  `).join('');
}

function validateForm(form){
  let valid = true;
  const check = (fieldId, condition)=>{
    const el = document.getElementById(fieldId);
    if(!el) return;
    if(!condition){ el.classList.add('invalid'); valid = false; }
    else el.classList.remove('invalid');
  };
  const fd = new FormData(form);
  check('f-eventId', !!fd.get('eventId'));
  check('f-fullName', !!fd.get('fullName') && fd.get('fullName').trim().length>1);
  check('f-email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fd.get('email')||''));
  check('f-phone', !!fd.get('phone') && fd.get('phone').trim().length>=7);
  check('f-inClub', !!fd.get('inClub'));
  check('f-social', !!fd.get('social') && fd.get('social').trim().length>1);
  check('f-experience', !!fd.get('experience'));
  check('f-cycles', fd.getAll('cycles').length>0);
  check('f-vehicle', !!fd.get('vehicle') && fd.get('vehicle').trim().length>1);
  check('f-plate', !!fd.get('plate') && fd.get('plate').trim().length>1);
  check('f-photos', vehiclePhotoBlobs.length>0);
  check('f-agree', document.getElementById('agreeBox').checked);

  if(!valid){
    const firstInvalid = document.querySelector('.invalid');
    if(firstInvalid) firstInvalid.scrollIntoView({behavior:'smooth', block:'center'});
    showToast('Please fix the highlighted field before submitting.', true);
  }
  return valid;
}

function bindSetupEvents(){
  document.getElementById('setupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim().toLowerCase();
    const pass = document.getElementById('su-pass').value;
    const pass2 = document.getElementById('su-pass2').value;
    const err = document.getElementById('setupErr');
    const msg = document.getElementById('setupMsg');
    err.style.display='none'; msg.style.display='none';
    if(!name || !email || !pass){ err.textContent = 'Fill out every field.'; err.style.display='block'; return; }
    if(pass !== pass2){ err.textContent = 'Passwords do not match.'; err.style.display='block'; return; }
    if(pass.length < 6){ err.textContent = 'Password should be at least 6 characters.'; err.style.display='block'; return; }

    const btn = document.getElementById('setupBtn');
    btn.disabled = true; btn.textContent = 'Creating…';

    const { data, error } = await sb.auth.signUp({ email, password: pass });
    if(error){ err.textContent = error.message; err.style.display='block'; btn.disabled=false; btn.textContent='Create admin account'; return; }
    if(!data.user){ err.textContent = 'Something went wrong creating the account.'; err.style.display='block'; btn.disabled=false; btn.textContent='Create admin account'; return; }

    const { error: profErr } = await sb.from('team_profiles').insert({ id:data.user.id, name, email, role:'admin' });
    if(profErr){ err.textContent = profErr.message; err.style.display='block'; btn.disabled=false; btn.textContent='Create admin account'; return; }

    if(data.session){
      currentUser = { id:data.user.id, name, email, role:'admin' };
      showToast('Admin account created');
      render();
    } else {
      msg.textContent = 'Account created. Check your email to confirm it, then sign in.';
      msg.style.display = 'block';
      btn.disabled=false; btn.textContent='Create admin account';
      setTimeout(render, 2200);
    }
  });
}

        ${adminTab==='submissions' ? SubmissionsTab(events||[], subs||[]) : ''}

}

  return `
    <div class="toolbar">
      <div class="filter-pills">
        <button class="pill ${subFilterStatus==='pending'?'active':''}" data-status="pending">Pending</button>

        <option value="all">All events</option>
        ${events.map(e=>`<option value="${e.id}" ${subFilterEvent===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}

    <div class="sub-list">

/* ---- binding: dashboard-level ---- */
function bindAdminEvents(){
  document.getElementById('logoutBtn')?.addEventListener('click', async ()=>{
    await sb.auth.signOut();
    currentUser = null; location.hash = 'admin'; render();
  });

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      adminTab = btn.dataset.tab;
      await renderTabContent();
    });
  });

  bindSubmissionsTabEvents();
  bindEventsTabEvents();
  bindTeamTabEvents();
}

let PARK = {}, PARK_ON = false;
const PARK_DEFAULT_ZONES = [{name:'Front VIP',color:'#ffb020'},{name:'Middle VIP',color:'#a78bfa'},{name:'Back VIP',color:'#3dd6ff'},{name:'General',color:'#9a9aa6'}];
const PARK_ZONES = {};
async function loadParking(){
  const { data, error } = await sb.rpc('checkin_parking', { p_event: null });
  PARK_ON = !error; PARK = {};
  (data||[]).forEach(r=>{ PARK[r.submission_id] = r; });
  const { data: sch } = await sb.from('checkin_schedules').select('event_id,zones');
  (sch||[]).forEach(s=>{ PARK_ZONES[s.event_id] = (s.zones&&s.zones.length) ? s.zones : PARK_DEFAULT_ZONES; });
}
function zonesFor(evId){ return PARK_ZONES[evId] || PARK_DEFAULT_ZONES; }
function parkBadge(s){
  const p = PARK[s.id]; if(!p || !p.zone) return '';
  const z = zonesFor(s.event_id).find(z=>z.name.toLowerCase()===String(p.zone).toLowerCase());
  return `<div><span class="pk-badge" style="--c:${escapeAttr((z&&z.color)||'#ffb020')}">${escapeHtml(p.zone)}${p.spot?' · '+escapeHtml(p.spot):''}${p.paid?' · Paid':''}</span></div>`;
}

async function renderTabContent(){
  const [{ data: events }, { data: subs }, { data: team }] = await Promise.all([
    sb.from('events').select('*').order('created_at', {ascending:false}),
    sb.from('submissions').select('id,event_id,status,full_name,vehicle,email,submitted_at').order('submitted_at', {ascending:false}),
    currentUser.role==='admin' ? sb.from('team_profiles').select('*').order('created_at') : Promise.resolve({data:[]}),
    loadParking().catch(()=>{})
  ]);
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===adminTab));
  const c = document.getElementById('tabContent');
  if(adminTab==='submissions') c.innerHTML = SubmissionsTab(events||[], subs||[]);
  if(adminTab==='events') c.innerHTML = EventsTab(events||[]);
  if(adminTab==='team') c.innerHTML = TeamTab(team||[]);
  bindSubmissionsTabEvents();
  bindEventsTabEvents();
  bindTeamTabEvents();
}

function bindSubmissionsTabEvents(){
  document.querySelectorAll('.pill[data-status]').forEach(p=>{
    p.addEventListener('click', async ()=>{ subFilterStatus = p.dataset.status; await renderTabContent(); });
  });
  document.getElementById('eventFilter')?.addEventListener('change', async (e)=>{
    subFilterEvent = e.target.value; await renderTabContent();
  });
  document.querySelectorAll('.sub-row').forEach(row=>{
    row.addEventListener('click', ()=> openSubmissionModal(row.dataset.id));
  });
}

function bindEventsTabEvents(){
  document.getElementById('newEventBtn')?.addEventListener('click', ()=> openEventModal(null));
  document.querySelectorAll('.ev-edit').forEach(b=> b.addEventListener('click', ()=> openEventModal(b.dataset.id)));
  document.querySelectorAll('.ev-toggle').forEach(t=>{
    t.addEventListener('change', async ()=>{
      const { error } = await sb.from('events').update({active:t.checked}).eq('id', t.dataset.id);
      if(error){ showToast(error.message, true); t.checked = !t.checked; return; }
      showToast(t.checked? 'Event opened for registration' : 'Event closed');
    });
  });
  document.querySelectorAll('.ev-delete').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('Delete this event? Existing submissions for it will stay in the system but the event will no longer appear.')) return;
      const { error } = await sb.from('events').delete().eq('id', b.dataset.id);
      if(error){ showToast(error.message, true); return; }
      await renderTabContent();
      showToast('Event deleted');
    });
  });
}

function bindTeamTabEvents(){
  document.getElementById('newMemberBtn')?.addEventListener('click', openMemberModal);
  document.querySelectorAll('.member-remove').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const { data: team } = await sb.from('team_profiles').select('*');
      const admins = (team||[]).filter(u=>u.role==='admin');
      const target = (team||[]).find(u=>u.id===b.dataset.id);
      if(target && target.role==='admin' && admins.length<=1){ alert("You can't remove the last remaining admin."); return; }
      if(!confirm(`Remove ${target?target.name:'this member'} from the team? They'll lose access to the portal, but their sign-in account isn't deleted from Supabase.`)) return;
      const { error } = await sb.from('team_profiles').delete().eq('id', b.dataset.id);
      if(error){ showToast(error.message, true); return; }
      await renderTabContent();
      showToast('Member removed');
    });
  });
}

/* ---- VIP PARKING ---- */
function parkPanel(sub){
  const p = PARK[sub.id] || {zone:'',spot:'',arrival:'',note:'',paid:false};
  const zones = zonesFor(sub.event_id);
  const extra = p.zone && !zones.some(z=>z.name===p.zone) ? [{name:p.zone,color:'#ffb020'}] : [];
  return `<div class="pk-panel" id="pkPanel">
    <h4>VIP parking</h4>
    <p class="pk-sub">${sub.status==='approved' ? 'Shows on their check-in pass right away and on the team scanner.' : 'Saved now. It shows on their check-in pass once the car is approved.'}</p>
    <label class="flabel">Parking zone</label>
    <div class="pk-zones" id="pkZones"><button type="button" data-z="" class="${p.zone?'':'on'}" style="--c:#9a9aa6">None</button>${zones.concat(extra).map(z=>`<button type="button" data-z="${escapeAttr(z.name)}" class="${z.name===p.zone?'on':''}" style="--c:${escapeAttr(z.color||'#ffb020')}">${escapeHtml(z.name)}</button>`).join('')}</div>
    <div class="pk-grid" style="margin-top:14px">
      <div><label class="flabel">Spot</label><input type="text" id="pkSpot" maxlength="20" placeholder="e.g. A3" value="${escapeAttr(p.spot||'')}"></div>
      <div><label class="flabel">Arrival time</label><input type="text" id="pkArr" maxlength="40" placeholder="e.g. 10:00–10:15 AM" value="${escapeAttr(p.arrival||'')}"></div>
      <div class="full"><label class="flabel">Note to the showcaser</label><input type="text" id="pkNote" maxlength="300" placeholder="e.g. Enter through Gate B" value="${escapeAttr(p.note||'')}"></div>
      <label class="pk-paid full"><input type="checkbox" id="pkPaid" ${p.paid?'checked':''}> Paid for VIP parking</label>
    </div>
    <div class="pk-foot"><span id="pkMsg"></span><button type="button" class="btn btn-primary btn-sm" id="pkSave">Save parking</button></div>
  </div>`;
}
function bindParkPanel(bg, sub){
  const panel = bg.querySelector('#pkPanel'); if(!panel) return;
  let zone = (PARK[sub.id]||{}).zone || '';
  panel.querySelectorAll('#pkZones button').forEach(b=> b.addEventListener('click', ()=>{
    zone = b.dataset.z; panel.querySelectorAll('#pkZones button').forEach(x=>x.classList.toggle('on', x===b));
  }));
  panel.querySelector('#pkSave').addEventListener('click', async (e)=>{
    const btn = e.currentTarget; btn.disabled = true;
    const row = { p_submission: sub.id, p_zone: zone, p_spot: panel.querySelector('#pkSpot').value.trim(), p_arrival: panel.querySelector('#pkArr').value.trim(), p_note: panel.querySelector('#pkNote').value.trim(), p_paid: panel.querySelector('#pkPaid').checked };
    const { error } = await sb.rpc('checkin_set_parking', row);
    btn.disabled = false;
    if(error){ showToast(/not_allowed/.test(error.message) ? 'Only admins can assign parking.' : error.message, true); return; }
    PARK[sub.id] = { submission_id: sub.id, zone: row.p_zone, spot: row.p_spot, arrival: row.p_arrival, note: row.p_note, paid: row.p_paid };
    panel.querySelector('#pkMsg').textContent = 'Saved ✓';
    showToast('Parking saved');
    renderTabContent();
  });
}

/* ---- MODALS ---- */
function openModal(html){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = html;
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

async function openSubmissionModal(id){
  const { data: sub, error } = await sb.from('submissions').select('*').eq('id', id).single();
  if(error || !sub){ showToast('Could not load that submission.', true); return; }
  const { data: ev } = await sb.from('events').select('*').eq('id', sub.event_id).maybeSingle();

  const allPaths = [...(sub.photo_paths||[])];
  if(sub.id_photo_path) allPaths.push(sub.id_photo_path);
  let signedMap = {};
  if(allPaths.length){
    const { data: signedList } = await sb.storage.from(BUCKET).createSignedUrls(allPaths, 3600);
    (signedList||[]).forEach(s=>{ if(s.signedUrl) signedMap[s.path] = s.signedUrl; });
  }
  const photoUrls = (sub.photo_paths||[]).map(p=>signedMap[p]).filter(Boolean);
  const idUrl = sub.id_photo_path ? signedMap[sub.id_photo_path] : null;

  const bg = openModal(`
    <div class="modal">
      <div class="modal-head"><h3>${escapeHtml(sub.full_name)}</h3><button class="modal-close" data-close>×</button></div>
      <div class="modal-body">
        <div class="dt-grid">
          <div class="dt-item"><div class="dtl">Event</div><div class="dtv">${escapeHtml(ev?ev.name:'—')}</div></div>
          <div class="dt-item"><div class="dtl">Status</div><div class="dtv"><span class="badge ${sub.status}">${sub.status}</span></div></div>
          <div class="dt-item"><div class="dtl">Email</div><div class="dtv">${escapeHtml(sub.email)}</div></div>
          <div class="dt-item"><div class="dtl">Phone</div><div class="dtv">${escapeHtml(sub.phone)}</div></div>
          <div class="dt-item"><div class="dtl">Club / group</div><div class="dtv">${sub.in_club==='yes' ? escapeHtml(sub.club_name||'Yes (unnamed)') : 'Not affiliated'}</div></div>
          <div class="dt-item"><div class="dtl">Social</div><div class="dtv">${escapeHtml(sub.social)}</div></div>
          <div class="dt-item"><div class="dtl">Experience</div><div class="dtv">${escapeHtml(sub.experience)}</div></div>
          <div class="dt-item"><div class="dtl">Available cycles</div><div class="dtv">${(sub.cycles||[]).map(escapeHtml).join(', ')||'—'}</div></div>
          <div class="dt-item"><div class="dtl">Vehicle</div><div class="dtv">${escapeHtml(sub.vehicle)}</div></div>
          <div class="dt-item"><div class="dtl">Plate</div><div class="dtv">${escapeHtml(sub.plate)}</div></div>
          <div class="dt-item full"><div class="dtl">Modifications</div><div class="dtv">${escapeHtml(sub.modifications)||'—'}</div></div>
          <div class="dt-item full">
            <div class="dtl">Vehicle photos</div>
            <div class="gallery" id="photoGallery">${photoUrls.map(p=>`<img src="${p}">`).join('') || '<span style="color:#5c5c66;font-size:12.5px;">No photos</span>'}</div>
          </div>
          ${idUrl ? `
          <div class="dt-item full">
            <div class="dtl">Government ID — confidential, click to reveal</div>
            <div class="id-shot" id="idShot"><img src="${idUrl}"><div class="reveal-tag">Tap to reveal</div></div>
          </div>` : ''}
          <div class="dt-item full">
            <div class="dtl">Reference</div>
            <div class="dtv" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#5c5c66;">${sub.id.slice(0,8).toUpperCase()} · submitted ${fmtDate(sub.submitted_at)}</div>
          </div>
          ${sub.reviewed_by ? `<div class="dt-item full"><div class="dtl">Reviewed by</div><div class="dtv">${escapeHtml(sub.reviewed_by)} on ${fmtDate(sub.reviewed_at)}</div></div>` : ''}
        </div>
        ${PARK_ON && currentUser.role==='admin' ? parkPanel(sub) : ''}
        <div class="note-area">
          <label class="flabel">Internal note (optional)</label>
          <textarea id="reviewNote" placeholder="Notes visible only to the team">${escapeHtml(sub.note||'')}</textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-sm" data-close>Close</button>
        <button class="btn btn-danger" id="denyBtn">Deny</button>
        <button class="btn btn-primary" id="approveBtn">Approve</button>
      </div>
    </div>
  `);

  bg.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', ()=>bg.remove()));
  bg.querySelectorAll('#photoGallery img').forEach(img=>{
    img.addEventListener('click', ()=>{
      const lb = document.createElement('div');
      lb.className='lightbox';
      lb.innerHTML = `<img src="${img.src}">`;
      lb.addEventListener('click', ()=>lb.remove());
      document.body.appendChild(lb);
    });
  });
  bindParkPanel(bg, sub);
  const idShot = bg.querySelector('#idShot');
  idShot?.addEventListener('click', ()=> idShot.classList.toggle('revealed'));

  bg.querySelector('#approveBtn').addEventListener('click', async ()=>{
    const note = bg.querySelector('#reviewNote').value;
    const { error } = await sb.from('submissions').update({
      status:'approved', reviewed_by:currentUser.name, reviewed_at:new Date().toISOString(), note
    }).eq('id', sub.id);
    if(error){ showToast(error.message, true); return; }
    sub.status='approved';
    bg.remove();
    await renderTabContent();
    openEmailModal(sub, ev, 'approved');
  });
  bg.querySelector('#denyBtn').addEventListener('click', async ()=>{

      status:'denied', reviewed_by:currentUser.name, reviewed_at:new Date().toISOString(), note
    }).eq('id', sub.id);
    if(error){ showToast(error.message, true); return; }

function openEmailModal(sub, ev, kind){
  const eventName = ev ? ev.name : 'the event';
  const confirmedLink = ev && ev.confirmed_link ? ev.confirmed_link : '(add your confirmed roster link in Events → Edit)';
  const subject = kind==='approved'
    ? `You're confirmed for ${eventName} — TORQ Events`
    : `Update on your ${eventName} registration — TORQ Events`;
  const body = kind==='approved'
    ? `Hey ${sub.full_name.split(' ')[0]},

Your ${sub.vehicle} has been approved for ${eventName}. We're excited to have you on the lineup.

Confirmed roster: ${confirmedLink}

Please review the event schedule and arrival time closer to the date, and remember: no drifting, burnouts, or takeovers — zero tolerance.

See you there,
TORQ Events Team`
    : `Hey ${sub.full_name.split(' ')[0]},

Thanks for registering your ${sub.vehicle} for ${eventName}. After review, we're not able to confirm your vehicle for this cycle.

You're welcome to apply again for a future TORQ Events cycle.

TORQ Events Team`;

  const mailto = `mailto:${encodeURIComponent(sub.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  const bg = openModal(`
    <div class="modal">
      <div class="modal-head"><h3>${kind==='approved'?'Send approval email':'Send decision email'}</h3><button class="modal-close" data-close>×</button></div>
      <div class="modal-body">
        <div class="banner">This portal can't send email directly — use the button below to open it in your email app with everything prefilled, or copy the text.</div>
        <div class="email-preview">
          <div class="ehead"><img src="${LOGO_WHITE}" alt="TORQ"></div>
          <div class="ebody">
            <div class="email-field"><label>To</label>${escapeHtml(sub.email)}</div>
            <div class="email-field"><label>Subject</label>${escapeHtml(subject)}</div>
            <div class="email-field"><label>Message</label><p style="white-space:pre-wrap;">${escapeHtml(body)}</p></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-sm" data-close>Close</button>
        <button class="btn btn-ghost" id="copyEmailBtn">Copy text</button>
        <a class="btn btn-primary" href="${mailto}" style="text-decoration:none;">Open in Mail App</a>
      </div>
    </div>
  `);
  bg.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', ()=>bg.remove()));
  bg.querySelector('#copyEmailBtn').addEventListener('click', ()=>{
    navigator.clipboard.writeText(`Subject: ${subject}\n\n${body}`).then(()=> showToast('Email text copied'));
  });
}

function openEventModal(id){
  (async ()=>{
    let ev = {id:null, name:'', description:'', location:'', event_date:'', confirmed_link:'', active:true};
    const isNew = !id;
    if(id){
      const { data } = await sb.from('events').select('*').eq('id', id).single();
      if(data) ev = data;
    }
    const bg = openModal(`
      <div class="modal">
        <div class="modal-head"><h3>${isNew?'New event':'Edit event'}</h3><button class="modal-close" data-close>×</button></div>
        <div class="modal-body">
          <div class="field"><label class="flabel">Event name</label><input type="text" id="ev-name" value="${escapeAttr(ev.name)}" placeholder="e.g. TORQ Fall Showdown 2026"></div>
          <div class="field"><label class="flabel">Date</label><input type="text" id="ev-date" value="${escapeAttr(ev.event_date)}" placeholder="e.g. Nov 8, 2026"></div>
          <div class="field"><label class="flabel">Location</label><input type="text" id="ev-location" value="${escapeAttr(ev.location)}" placeholder="e.g. Atlantic Station, Atlanta"></div>
          <div class="field"><label class="flabel">Description</label><textarea id="ev-desc" placeholder="Shown nowhere public yet — internal reference">${escapeHtml(ev.description)}</textarea></div>
          <div class="field"><label class="flabel">Confirmed roster link</label><input type="text" id="ev-link" value="${escapeAttr(ev.confirmed_link||'')}" placeholder="Link to your confirmed-cars page, used in approval emails"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost btn-sm" data-close>Cancel</button>
          <button class="btn btn-primary" id="saveEventBtn">${isNew?'Create event':'Save changes'}</button>
        </div>
      </div>
    `);
    bg.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', ()=>bg.remove()));
    bg.querySelector('#saveEventBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('ev-name').value.trim();
      if(!name){ alert('Event name is required.'); return; }
      const payload = {
        name,
        event_date: document.getElementById('ev-date').value.trim(),
        location: document.getElementById('ev-location').value.trim(),
        description: document.getElementById('ev-desc').value.trim(),
        confirmed_link: document.getElementById('ev-link').value.trim()
      };
      let res;
      if(isNew) res = await sb.from('events').insert(payload);
      else res = await sb.from('events').update(payload).eq('id', ev.id);
      if(res.error){ showToast(res.error.message, true); return; }
      bg.remove();
      await renderTabContent();
      showToast(isNew ? 'Event created' : 'Event updated');
    });
  })();
}

function openMemberModal(){
  const bg = openModal(`
    <div class="modal">
      <div class="modal-head"><h3>Add team member</h3><button class="modal-close" data-close>×</button></div>
      <div class="modal-body">
        <div class="auth-err" id="memberErr"></div>
        <div class="banner">They'll be able to sign in with this email and password right away. If your Supabase project still requires email confirmation, they'll need to confirm it from their inbox first.</div>
        <div class="field"><label class="flabel">Full name</label><input type="text" id="mem-name"></div>
        <div class="field"><label class="flabel">Email</label><input type="email" id="mem-email"></div>
        <div class="field"><label class="flabel">Temporary password</label><input type="text" id="mem-pass" placeholder="6+ characters"></div>
        <div class="field">
          <label class="flabel">Role</label>
          <select id="mem-role">
            <option value="reviewer">Reviewer — can view &amp; approve/deny submissions</option>
            <option value="admin">Admin — can also manage events &amp; team</option>
          </select>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-sm" data-close>Cancel</button>
        <button class="btn btn-primary" id="saveMemberBtn">Add member</button>
      </div>
    </div>
  `);
  bg.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', ()=>bg.remove()));
  bg.querySelector('#saveMemberBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('mem-name').value.trim();
    const email = document.getElementById('mem-email').value.trim().toLowerCase();
    const pass = document.getElementById('mem-pass').value;
    const role = document.getElementById('mem-role').value;
    const err = document.getElementById('memberErr');
    err.style.display='none';
    if(!name || !email || !pass){ err.textContent='Fill out every field.'; err.style.display='block'; return; }
    if(pass.length < 6){ err.textContent='Password should be at least 6 characters.'; err.style.display='block'; return; }

    const saveBtn = bg.querySelector('#saveMemberBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'Adding…';

    // use a throwaway client so this signUp doesn't clobber the admin's own session
    const tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession:false, autoRefreshToken:false }
    });
    const { data, error } = await tempClient.auth.signUp({ email, password: pass });
    if(error){ err.textContent = error.message; err.style.display='block'; saveBtn.disabled=false; saveBtn.textContent='Add member'; return; }
    if(!data.user){ err.textContent = 'Could not create that account.'; err.style.display='block'; saveBtn.disabled=false; saveBtn.textContent='Add member'; return; }

    const { error: profErr } = await sb.from('team_profiles').insert({ id:data.user.id, name, email, role });
    if(profErr){ err.textContent = profErr.message; err.style.display='block'; saveBtn.disabled=false; saveBtn.textContent='Add member'; return; }

    bg.remove();
    await renderTabContent();
    showToast('Team member added');
  });
}

/* ---------------- boot ---------------- */
(async ()=>{
  await restoreSession();
  render();
})();
</script>
</body>
</html>
